# config/packages/vich_uploader.yaml
vich_uploader:
    db_driver: orm
    mappings:
        cv_files: # Le nom de votre "règle" pour les CVs
            uri_prefix: /uploads/cvs
            upload_destination: '%kernel.project_dir%/public/uploads/cvs'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
