# config/services.yaml

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    twilio_account_sid: '%env(TWILIO_ACCOUNT_SID)%'
    twilio_auth_token: '%env(TWILIO_AUTH_TOKEN)%'
    twilio_from_number: '%env(TWILIO_FROM_NUMBER)%'
    low_stock_threshold: '%env(int:LOW_STOCK_THRESHOLD)%'
    hf_api_key: '%env(HUGGINGFACE_API_KEY)%'
    PHOTO_API_URL_DEFAULT: 'http://127.0.0.1:8001'
    PHOTO_API_KEY_DEFAULT: 'starthub-photo-secret'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $lowStockThreshold: '%low_stock_threshold%'
            $hfApiKey: '%hf_api_key%'
            $huggingFaceToken: '%env(HUGGING_FACE_TOKEN)%'
            $mailerFrom: 'arijselmi580@gmail.com'
            $mailerFromEmail: '%env(MAILER_FROM_EMAIL)%'
            $mailerFromName: 'StartHub'
            $mailerToOverride: '%env(MAILER_TO_OVERRIDE)%'
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripePublicKey: '%env(STRIPE_PUBLIC_KEY)%'
            $appBaseUrl: '%env(APP_BASE_URL)%'
            $zoomAccountId: '%env(ZOOM_ACCOUNT_ID)%'
            $zoomClientId: '%env(ZOOM_CLIENT_ID)%'
            $zoomClientSecret: '%env(ZOOM_CLIENT_SECRET)%'
            $hcaptchaSiteKey: '%env(HCAPTCHA_SITE_KEY)%'
            $hcaptchaSecretKey: '%env(HCAPTCHA_SECRET_KEY)%'
            $appEnv: '%env(APP_ENV)%'
            $openAiApiKey: '%env(OPENAI_API_KEY)%'
            $photoApiUrl: '%env(default:PHOTO_API_URL_DEFAULT:PHOTO_API_URL)%'
            $photoApiKey: '%env(default:PHOTO_API_KEY_DEFAULT:PHOTO_API_KEY)%'


    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Controllers
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Repositories
    App\Repository\:
        resource: '../src/Repository/'
        tags: ['doctrine.repository_service']

    # StartHub AI Service
    App\Service\StartHubAIService:
        arguments:
            $startHubApiUrl: '%env(STARTHUB_API_URL)%'
            $startHubApiKey: '%env(STARTHUB_API_KEY)%'

    # Marketstack Service
    App\Service\MarketstackService:
        arguments:
            $marketstackApiKey: '%env(MARKETSTACK_API_KEY)%'

    # Google Patents (SerpAPI) Service
    App\Service\GooglePatentsService:
        arguments:
            $serpapiApiKey: '%env(SERPAPI_API_KEY)%'

    # File Uploader Service
    App\Service\FileUploader:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/projets'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones